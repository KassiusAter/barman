<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --pozadi: #14181d; --panel: #1d232b; --panel2: #242c36;

    --zelena: #4caf7d; --zluta: #e0b34c; --cervena: #d06a5f;
    --akcent: #d99a4e; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--pozadi); color: var(--text);
    font: 16px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 60px;
  }
  header {
    background: linear-gradient(180deg, #1a2027, var(--pozadi));
    padding: 22px 16px 0; text-align: center;
    border-bottom: 1px solid var(--linka);
  }
  header h1 { font-size: 26px; letter-spacing: .5px; }
  header .stat { color: var(--tlumeny); font-size: 14px; margin: 6px 0 14px; }
  nav { display: flex; justify-content: center; gap: 6px; }
  nav button {
    background: none; border: none; color: var(--tlumeny); cursor: pointer;
    font-size: 16px; padding: 10px 22px; border-bottom: 3px solid transparent;
  }
  nav button.aktivni { color: var(--text); border-color: var(--akcent); font-weight: 600; }
  main { max-width: 860px; margin: 0 auto; padding: 18px 14px; }
  .zalozka { display: none; }
  .zalozka.aktivni { display: block; }

  /* ovládací lišta */
  .listy { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  input[type=search], select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--linka);
    border-radius: 8px; padding: 9px 12px; font-size: 15px;
  }
  input[type=search] { flex: 1; min-width: 160px; }
  .tolerance { display: flex; align-items: center; gap: 8px; background: var(--panel2);
    border: 1px solid var(--linka); border-radius: 8px; padding: 6px 12px; }
  .tolerance input { accent-color: var(--akcent); }
  label.prepinac { display: flex; align-items: center; gap: 6px; color: var(--tlumeny); font-size: 15px; cursor: pointer; }

  /* sekce drinků */
  h2 { font-size: 17px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2 .tecka { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .mrizka { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .karta {
    background: var(--panel); border: 1px solid var(--linka); border-radius: var(--radius);
    padding: 10px; display: flex; gap: 12px; align-items: center; cursor: pointer;
    transition: border-color .15s;
  }
  .karta:hover { border-color: var(--akcent); }
  .karta img, .karta svg { width: 58px; height: 58px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #0e1216; }
  .karta .nazev { font-weight: 600; }
  .karta .meta { color: var(--tlumeny); font-size: 13px; }
  .chybi-chip { display: inline-block; background: #3a2a24; color: #e8b294;
    border-radius: 6px; font-size: 12px; padding: 1px 7px; margin: 2px 3px 0 0; }
  .trivia { color: var(--tlumeny); font-size: 13px; margin-top: 4px; font-style: italic; }
  .trivia-detail { font-size: 14px; }
  .zamena-chip { display: inline-block; background: #23333f; color: #9cc4e0;
    border-radius: 6px; font-size: 12px; padding: 1px 7px; margin: 2px 3px 0 0; }
  .detail .mam-zamena::before { content: "↔ "; color: #9cc4e0; }
  .detail .mam-zamena { color: #9cc4e0; }
  details { margin-top: 14px; }
  details summary { cursor: pointer; color: var(--tlumeny); padding: 6px 0; }

  /* rádce */
  .radce { background: var(--panel); border: 1px solid var(--linka); border-radius: var(--radius); padding: 14px 16px; }
  .radce li { list-style: none; padding: 5px 0; border-bottom: 1px dashed var(--linka); }
  .radce li:last-child { border-bottom: none; }
  .radce b { color: var(--zluta); }

  /* můj bar */
  .kategorie h3 { font-size: 15px; color: var(--tlumeny); text-transform: uppercase;
    letter-spacing: .8px; margin: 20px 0 8px; }
  .chipy { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--panel); border: 1px solid var(--linka); border-radius: 20px;
    padding: 7px 14px; cursor: pointer; font-size: 15px; user-select: none;
    transition: background .12s, border-color .12s;
  }
  .chip.mam { background: #24402f; border-color: var(--zelena); }
  .chip input { display: none; }
  .zakladni-pozn { color: var(--tlumeny); font-size: 13px; margin-top: 22px; font-style: italic; }
  .pridat-listy input[type=text] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--linka);
    border-radius: 8px; padding: 9px 12px; font-size: 15px; flex: 1; min-width: 200px;
  }
  .pridat-listy button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--linka);
    border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 15px;
  }
  .pridat-listy button:hover { border-color: var(--akcent); }
  .pridat-zprava { color: var(--zelena); font-size: 14px; min-height: 20px; margin: -8px 0 6px 2px; }
  .srdce { color: var(--tlumeny); margin-left: 7px; cursor: pointer; }
  .srdce:hover { color: #e2707f; }
  .srdce.rad { color: #e2707f; }
  .chip .smazat-vlastni { color: var(--tlumeny); margin-left: 7px; font-weight: 700; }
  .chip .smazat-vlastni:hover { color: var(--cervena); }
  .nastroje { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .nastroje button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--linka);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  .nastroje button:hover { border-color: var(--akcent); }

  /* modal */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none;
    align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 10; }
  #modal.otevreny { display: flex; }
  .detail {
    background: var(--panel); border: 1px solid var(--linka); border-radius: 16px;
    max-width: 520px; width: 100%; padding: 22px; position: relative;
  }
  .detail .zavrit { position: absolute; top: 10px; right: 14px; background: none;
    border: none; color: var(--tlumeny); font-size: 26px; cursor: pointer; }
  .detail .obrazek { text-align: center; margin-bottom: 14px; }
  .detail .obrazek img, .detail .obrazek svg { width: 180px; height: 180px; border-radius: 12px; object-fit: cover; }
  .detail h2 { margin: 0 0 2px; font-size: 22px; justify-content: center; }
  .detail .alt { text-align: center; color: var(--tlumeny); font-size: 14px; margin-bottom: 12px; }
  .detail h4 { margin: 14px 0 6px; font-size: 14px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--akcent); }
  .detail ul { list-style: none; }
  .detail ul li { padding: 3px 0; }
  .detail .mam-ano::before { content: "✓ "; color: var(--zelena); }
  .detail .mam-ne::before { content: "✗ "; color: var(--cervena); }
  .detail .mam-ne { color: #e0a9a1; }
  .detail a.koupit { color: #e0a9a1; text-decoration: underline dotted; }
  .detail a.koupit:hover { color: #f0c4bc; text-decoration: underline; }
  .radce a.koupit { color: var(--zluta); text-decoration: underline dotted; }
  .radce a.koupit:hover { text-decoration: underline; }
  .detail .volitelna { color: var(--tlumeny); font-style: italic; }
  .detail .poznamka { color: var(--tlumeny); font-style: italic; margin-top: 12px; font-size: 14px; }
  .detail .varovani { background: #3b2a24; border: 1px solid var(--cervena); color: #efc0b6;

  .stitek { display: inline-block; font-size: 12px; border: 1px solid var(--linka);

  .prazdno { color: var(--tlumeny); font-style: italic; padding: 8px 0; }
  .uvod-nealko { background: #1d2a2c; border: 1px solid #2f4a4a; border-radius: 10px;

</head>

<header>
  <h1>🍸 Barman</h1>
  <div class="stat" id="statistika"></div>
  <nav>
    <button id="tab-drinky" class="aktivni">Drinky</button>
    <button id="tab-nealko">Pro řidiče a děti</button>
    <button id="tab-bar">Můj bar</button>
  </nav>
</header>

<main>
  <!-- ============ DRINKY ============ -->
  <section id="zalozka-drinky" class="zalozka aktivni">
    <div class="listy">
      <input type="search" id="hledat-drink" placeholder="Hledat drink (i přezdívky — zkus „flusanec“)…">
      <div class="tolerance" title="Kolik surovin je přípustné dokoupit">
        🛒 Tolerance <input type="range" id="tolerance" min="0" max="3" step="1" value="1">
        <b id="tolerance-hodnota">1</b>
      </div>
      <select id="filtr-typ">
        <option value="">Všechny typy</option>
        <option value="longdrink">Longdrinky</option>
        <option value="koktejl">Koktejly</option>
        <option value="shot">Panáky (shoty)</option>
        <option value="pivni-mix">Pivní mixy</option>
        <option value="multimichacka">Multimíchačky</option>
        <option value="horky">Horké</option>
      </select>
      <label class="prepinac" id="prepinac-deti" hidden>
        <input type="checkbox" id="filtr-deti"> jen pro děti 🧒</label>
    </div>
    <p id="uvod-nealko" class="uvod-nealko" hidden>
      🚗 Drinky bez kapky alkoholu — pro řidiče, děti i suchý únor.
      Nealkoholický sekt ani pivo se zde nenahrazují alkoholickými.
    </p>

    <h2><span class="tecka" style="background:var(--zelena)"></span>Můžeš míchat hned <span id="pocet-hned" class="stitek"></span></h2>
    <div class="mrizka" id="sekce-hned"></div>

    <h2><span class="tecka" style="background:var(--zluta)"></span>Stačí dokoupit <span id="pocet-dokoupit" class="stitek"></span></h2>
    <div class="mrizka" id="sekce-dokoupit"></div>

    <h2><span class="tecka" style="background:var(--akcent)"></span>Nákupní rádce</h2>
    <ul class="radce" id="sekce-radce"></ul>

    <details>
      <summary>Ostatní drinky (chybí toho víc) — <span id="pocet-ostatni"></span></summary>
      <div class="mrizka" id="sekce-ostatni" style="margin-top:10px"></div>
    </details>
  </section>

  <!-- ============ MŮJ BAR ============ -->
  <section id="zalozka-bar" class="zalozka">
    <div class="listy">
      <input type="search" id="hledat-surovinu" placeholder="Hledat surovinu…">
    </div>
    <div class="listy pridat-listy">
      <input type="text" id="nova-surovina" placeholder="Přidat surovinu — klidně značkou (Guinness, Sierra, domácí slivovice)…">
      <button id="btn-pridat">➕ Přidat</button>
    </div>
    <div id="pridat-zprava" class="pridat-zprava"></div>
    <div id="seznam-surovin"></div>
    <div class="nastroje">
      <button id="btn-export">⬇︎ Exportovat inventář</button>
      <button id="btn-import">⬆︎ Importovat inventář</button>
      <button id="btn-smazat">🗑 Vyprázdnit bar</button>
      <input type="file" id="import-soubor" accept=".json" hidden>
    </div>
  </section>
</main>

<!-- ============ DETAIL DRINKU ============ -->
<div id="modal">
  <div class="detail">
    <button class="zavrit" title="Zavřít">×</button>
    <div id="detail-obsah"></div>
  </div>
</div>

<script src="engine.js"></script>

/* ---------- počítadlo návštěv ----------
   Měří se jen webová verze na GitHub Pages. Rozdávaný barman_komplet.html se
   otevírá přes file:// a navíc má prázdný kód, takže z cizího počítače se
   neodesílá nic. GoatCounter nesahá na cookies ani localStorage. */
(function pocitadlo() {
  const kod = window.METRIKA_KOD;
  if (!kod || location.protocol === "file:") return;
  const s = document.createElement("script");
  s.async = true;
  s.dataset.goatcounter = "https://" + kod + ".goatcounter.com/count";
  s.src = "//gc.zgo.at/count.js";
  document.head.appendChild(s);
})();

const DATA = window.BARMAN_DATA;
const DRINKY = DATA.drinky;
const OBRAZKY = DATA.obrazky;

/* ---------- pomocníci ---------- */

// text vkládaný do HTML (vlastní suroviny a importované zálohy nejsou pod kontrolou)
const esc = t => String(t).replace(/[&<>"']/g, z =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[z]);

/* ---------- uložení stavu (localStorage) ---------- */
// zápis i čtení můžou selhat (anonymní okno, poškozená data) — aplikace pak
// běží dál, jen s prázdným barem
function uloz() {
  try {
    localStorage.setItem("barman", JSON.stringify({
      inventar: [...inventar], tolerance: +el("tolerance").value, vlastni,
      oblibene: [...oblibene]
    }));
  } catch { /* bez úložiště se stav jen nezapamatuje */ }
}
let nactene = {};
try { nactene = JSON.parse(localStorage.getItem("barman")) || {}; } catch { /* prázdný bar */ }
const pole = x => Array.isArray(x) ? x : [];
// uživatelovy suroviny: {id, nazev, kategorie, vlastni: true}
const vlastni = pole(nactene.vlastni).filter(v => v && v.id && v.nazev);

/* slovník = dodané suroviny + vlastní přidané uživatelem */

let SLOVNIK = {};
const prestavSlovnik = () =>
  SLOVNIK = Object.fromEntries(SUROVINY().map(s => [s.id, s]));
prestavSlovnik();

const oblibene = new Set(pole(nactene.oblibene).filter(id => SLOVNIK[id])); // „chutná mi“

/* tvar sklenice podle textu v poli "sklenice" -> vnitřek sklenice jako polygon */
function tvarSklenice(text) {
  const t = (text || "").toLowerCase();
  if (t.includes("koktejlka") || t.includes("margarit"))
    return { vnitrek: "15,35 85,35 50,72", stopka: "M50 72 L50 105 M32 108 L68 108" };
  if (t.includes("flétna") || t.includes("sekt"))
    return { vnitrek: "40,18 60,18 57,75 43,75", stopka: "M50 75 L50 105 M36 108 L64 108" };
  if (t.includes("vinná") || t.includes("copa") || t.includes("balonová") || t.includes("džbán"))
    return { vnitrek: "30,28 70,28 66,62 55,70 45,70 34,62", stopka: "M50 70 L50 103 M34 106 L66 106" };
  if (t.includes("půllitr") || t.includes("třetinka"))
    return { vnitrek: "28,25 66,25 66,105 28,105", ucho: true };
  if (t.includes("panák") || t.includes("kolínko") || t.includes("sherry"))
    return { vnitrek: "36,55 64,55 60,100 40,100" };
  if (t.includes("hrnek") || t.includes("ouškem") || t.includes("pohárek"))
    return { vnitrek: "30,35 68,35 68,100 30,100", ucho: true };
  return { vnitrek: "32,25 68,25 64,105 36,105" }; // highball / tumbler
}

/* SVG silueta drinku: sklenice + barevné vrstvy podle surovin (odspodu dle receptu) */
function svgDrinku(drink, velikost) {
  const tvar = tvarSklenice(drink.sklenice);
  const slozky = drink.suroviny.filter(s => !s.volitelne).slice(0, 5);
  const body = tvar.vnitrek.split(" ").map(p => p.split(",").map(Number));
  const ys = body.map(b => b[1]);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const id = "clip" + Math.random().toString(36).slice(2, 8);
  let vrstvy = "";
  const n = slozky.length || 1;
  for (let i = 0; i < n; i++) {
    const barva = BARVY[slozky[n - 1 - i] ? slozky[n - 1 - i].id : ""] || "#7f8c99";
    const y = minY + ((maxY - minY) / n) * i;
    vrstvy += `<rect x="0" y="${y}" width="100" height="${(maxY - minY) / n + 1}" fill="${barva}"/>`;
  }
  const ucho = tvar.ucho ? `<path d="M68 45 Q88 45 88 65 Q88 85 68 85" fill="none" stroke="#9fb0bd" stroke-width="4"/>` : "";
  const stopka = tvar.stopka ? `<path d="${tvar.stopka}" stroke="#9fb0bd" stroke-width="4" fill="none" stroke-linecap="round"/>` : "";
  return `<svg viewBox="0 0 100 140" width="${velikost}" height="${velikost}" style="background:#10151a;border-radius:8px">
    <clipPath id="${id}"><polygon points="${tvar.vnitrek}"/></clipPath>
    <g clip-path="url(#${id})">${vrstvy}</g>
    <polygon points="${tvar.vnitrek}" fill="none" stroke="#9fb0bd" stroke-width="3"/>
    ${ucho}${stopka}</svg>`;
}

function obrazekDrinku(drink, velikost) {
  const soubor = OBRAZKY[drink.nazev];
  if (!soubor) return svgDrinku(drink, velikost);
  // v distribuční verzi je obrázek vložen přímo jako data:URI
  const src = soubor.startsWith("data:") ? soubor : "data/img/" + soubor;
  return `<img src="${src}" alt="${esc(drink.nazev)}" loading="lazy">`;
}

/* ---------- záložka Můj bar ---------- */
function chipHtml(s) {
  const mam = inventar.has(s.id);
  const rad = oblibene.has(s.id);
  const krizek = s.vlastni
    ? `<span class="smazat-vlastni" title="Smazat vlastní surovinu">×</span>` : "";
  const srdce = `<span class="srdce ${rad ? "rad" : ""}"
    title="${rad ? "Chutná mi — drinky s ní jsou první" : "Označit „chutná mi“"}">${rad ? "♥" : "♡"}</span>`;
  return `<label class="chip ${mam ? "mam" : ""}" data-id="${esc(s.id)}">
    <input type="checkbox" ${mam ? "checked" : ""}>${esc(s.nazev)}${srdce}${krizek}</label>`;
}

/* normalizované značky pro hledání: id -> ["guinness", "kozel cerny", …] */
const ZNACKY_HLEDANI = {};
Object.entries(DATA.znacky || {}).forEach(([id, znacky]) => {
  ZNACKY_HLEDANI[id] = znacky.map(z => Barman.normalizuj(z));
});

function vykresliBar() {
  const filtr = Barman.normalizuj(el("hledat-surovinu").value);
  const sedi = s => !filtr ||
    Barman.normalizuj(s.nazev).includes(filtr) ||
    (ZNACKY_HLEDANI[s.id] || []).some(z => z.includes(filtr));
  const viditelne = SUROVINY()
    .filter(s => !s.zakladni && sedi(s))
    .sort((a, b) => a.nazev.localeCompare(b.nazev, "cs"));
  // oblíbené suroviny drž nahoře
  const poradi = (a, b) =>
    (oblibene.has(b.id) - oblibene.has(a.id)) || a.nazev.localeCompare(b.nazev, "cs");
  const mam = viditelne.filter(s => inventar.has(s.id)).sort(poradi);
  const nemam = viditelne.filter(s => !inventar.has(s.id)).sort(poradi);

  let html = "";
  html += `<div class="kategorie"><h3>✓ Mám v baru (${mam.length})</h3><div class="chipy">`;
  html += mam.map(chipHtml).join("") ||
    `<span class="prazdno">Zatím prázdno — klikni dole na to, co máš doma.</span>`;
  html += `</div></div>`;
  html += `<div class="kategorie"><h3>Klikni, co máš doma</h3><div class="chipy">`;
  html += nemam.map(chipHtml).join("") ||
    `<span class="prazdno">Nic dalšího nenalezeno.</span>`;
  html += `</div></div>`;
  html += `<p class="zakladni-pozn">Cukr, sůl, pepř, led a voda se berou jako samozřejmost — počítají se automaticky.</p>`;

  el("seznam-surovin").innerHTML = html;
}
el("hledat-surovinu").addEventListener("input", vykresliBar);

/* jeden posluchač na celý seznam surovin místo jednoho na každý chip */

el("seznam-surovin").addEventListener("click", ev => {
  const srdce = ev.target.closest(".srdce"), krizek = ev.target.closest(".smazat-vlastni");
  if (!srdce && !krizek) return;
  ev.preventDefault(); // klik na srdce či křížek nesmí zaškrtnout surovinu
  const id = ev.target.closest("label.chip").dataset.id;
  if (srdce) {
    oblibene.has(id) ? oblibene.delete(id) : oblibene.add(id);
  } else {
    const s = SLOVNIK[id];
    if (!confirm(`Smazat vlastní surovinu „${s ? s.nazev : id}“?`)) return;
    const i = vlastni.findIndex(v => v.id === id);
    if (i !== -1) vlastni.splice(i, 1);
    inventar.delete(id); oblibene.delete(id);
    prestavSlovnik();
  }
  zmenaBaru();
});

/* rozpoznávání obchodních značek: „Guinness“ → černé pivo, „Sierra“ → tequila */
const naSlova = text => Barman.normalizuj(text).split(/[^a-z0-9]+/).filter(Boolean);

/* Shoda dvou slov: shodná, nebo lišící se koncovkou („sierry“ ~ „sierra“).
   Porovnává se po celých slovech — jinak by „rum“ sedělo na „KonifeRUM“. */
function shodaSlov(a, b) {
  if (a === b) return true;
  // skloňování mění konec slova, ne jeho délku: „Scapa“ ≠ „Scapegrace“
  if (a.length < 5 || b.length < 5 || Math.abs(a.length - b.length) > 2) return false;
  const kmen = Math.min(a.length, b.length) - 1;
  return a.slice(0, kmen) === b.slice(0, kmen);
}

function najdiZnacku(text) {
  const slovaVstupu = naSlova(text);
  if (!slovaVstupu.length) return null;
  let nej = null; // vyhrává nejpodrobnější značka: „Kinley Ginger Ale“ > „Kinley“
  for (const [id, znacky] of Object.entries(DATA.znacky || {})) {
    for (const z of znacky) {
      const slovaZnacky = naSlova(z);
      if (!slovaZnacky.length) continue;
      // víceslovná značka musí sedět celá („tmavé pivo“ ≠ „rum tmavý“)
      const sedi = slovaZnacky.every(sz =>
        slovaVstupu.some(sv => shodaSlov(sv, sz)));
      if (!sedi) continue;
      // krátká jednoslovná značka (7Up) jen když je zadáním celá
      const kratka = slovaZnacky.length === 1 && slovaZnacky[0].length < 4;
      if (kratka && !(slovaVstupu.length === 1 && slovaVstupu[0] === slovaZnacky[0]))
        continue;
      if (!nej || slovaZnacky.length > nej.slov)
        nej = { id: id, znacka: z, slov: slovaZnacky.length };
    }
  }
  return nej ? { id: nej.id, znacka: nej.znacka } : null;
}

/* Obecné suroviny podle názvu: „rum“ → Bílý/Tmavý/Tuzemský rum */
function najdiSuroviny(text) {
  const slovaVstupu = naSlova(text);
  if (!slovaVstupu.length) return [];
  return SUROVINY().filter(s => {
    const slovaNazvu = naSlova(s.nazev);
    return slovaVstupu.every(sv => slovaNazvu.some(sn => shodaSlov(sv, sn)));
  });
}

function zprava(text) {
  el("pridat-zprava").textContent = text || "";
}

/* přidání suroviny: nejdřív zkusit značku, pak obecný název, pak vlastní */
function pridejVlastniSurovinu() {
  const nazev = el("nova-surovina").value.trim();
  if (!nazev) return;

  // 1) obchodní značka známé suroviny?
  const znacka = najdiZnacku(nazev);
  if (znacka && SLOVNIK[znacka.id]) {
    const s = SLOVNIK[znacka.id];
    el("nova-surovina").value = "";
    if (inventar.has(znacka.id)) {
      zprava(`„${nazev}“ znám — je to ${s.nazev} a tu už máš zaškrtnutou.`);
      return;
    }
    inventar.add(znacka.id);
    zprava(`„${nazev}“ jsem zařadil jako: ${s.nazev} ✓`);
    zmenaBaru();
    return;
  }

  // 2) obecná surovina podle názvu („rum“, „tmavý rum“, „ocet“…)
  const nalezene = najdiSuroviny(nazev);
  if (nalezene.length === 1) {
    const s = nalezene[0];
    el("nova-surovina").value = "";
    if (s.zakladni) {
      zprava(`${s.nazev} se bere jako samozřejmost — počítá se automaticky.`);
      return;
    }
    if (inventar.has(s.id)) {
      zprava(`„${nazev}“ už máš zaškrtnuté jako ${s.nazev}.`);
      return;
    }
    inventar.add(s.id);
    zprava(`„${nazev}“ už v seznamu je jako ${s.nazev} — zaškrtl jsem ji. ✓`);
    zmenaBaru();
    return;
  }
  if (nalezene.length > 1) {
    // víc možností → ukázat je v seznamu a nechat vybrat
    el("hledat-surovinu").value = nazev;
    zprava(`„${nazev}“ může být: ${nalezene.map(s => s.nazev).join(", ")}` +
      ` — vyber dole, co máš doma.`);
    vykresliBar();
    return;
  }

  // 3) opravdu vlastní surovina
  const id = "vlastni-" + Barman.normalizuj(nazev).replace(/[^a-z0-9]+/g, "-");
  vlastni.push({ id, nazev, kategorie: "ostatni", vlastni: true });
  inventar.add(id); // přidává se to, co má doma
  el("nova-surovina").value = "";
  zprava(`„${nazev}“ přidána jako vlastní surovina.`);
  prestavSlovnik(); zmenaBaru();
}
el("btn-pridat").addEventListener("click", pridejVlastniSurovinu);
el("nova-surovina").addEventListener("keydown", ev => {
  if (ev.key === "Enter") pridejVlastniSurovinu();
});

/* export / import / smazání */
el("btn-export").onclick = () => {
  const blob = new Blob([JSON.stringify(
    { inventar: [...inventar], vlastni, oblibene: [...oblibene] }, null, 2)],
    { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "muj-bar.json";
  a.click();
};
el("btn-import").onclick = () => el("import-soubor").click();
el("import-soubor").addEventListener("change", ev => {
  const soubor = ev.target.files[0];
  if (!soubor) return;
  soubor.text().then(text => {
    try {
      const data = JSON.parse(text);
      // starý formát: pole id; nový: { inventar, vlastni }
      const ids = Array.isArray(data) ? data : data.inventar;
      if (!Array.isArray(ids)) throw new Error();
      vlastni.length = 0;
      (Array.isArray(data) ? [] : data.vlastni || []).forEach(v => {
        if (v && v.id && v.nazev) vlastni.push({ ...v, vlastni: true });
      });
      prestavSlovnik();
      inventar.clear();
      ids.filter(id => SLOVNIK[id]).forEach(id => inventar.add(id));
      oblibene.clear();
      (Array.isArray(data) ? [] : data.oblibene || [])
        .filter(id => SLOVNIK[id]).forEach(id => oblibene.add(id));
      zmenaBaru();
    } catch { alert("Soubor se nepodařilo načíst — čekám zálohu z tlačítka Exportovat."); }
    ev.target.value = "";
  });
});
el("btn-smazat").onclick = () => {
  if (confirm("Opravdu vyprázdnit celý bar? (Vlastní suroviny zůstanou v seznamu.)")) {
    inventar.clear(); zmenaBaru();
  }
};

/* ---------- záložka Drinky ---------- */
function karta(zaznam, sTrivii) {
  const d = zaznam.drink;
  const chybi = zaznam.chybiNazvy.map(n => `<span class="chybi-chip">chybí: ${esc(n)}</span>`).join("");
  const zameny = zaznam.zameny.map(z =>
    `<span class="zamena-chip">↔ ${esc(z.nahradaNazev)} místo: ${esc(z.zaNazev)}</span>`).join("");
  const trivia = sTrivii && d.trivia ? `<div class="trivia">💡 ${d.trivia}</div>` : "";
  const n = zaznam.oblibenych;
  return `<div class="karta" data-nazev="${esc(d.nazev)}">
    ${obrazekDrinku(d, 58)}
    <div><div class="nazev">${esc(d.nazev)}${d.nealko ? " 🥤" : ""}${d.deti ? " 🧒" : ""}${d.varovani ? " ⚠️" : ""}${
      n ? ` <span class="srdce rad" title="obsahuje ${n} ${sklonuj(n,
        ["oblíbenou surovinu", "oblíbené suroviny", "oblíbených surovin"])}">♥</span>` : ""}</div>
    <div class="meta">${d.sklenice}</div>${chybi}${zameny}${trivia}</div></div>`;
}

/* poslední vyhodnocení podle názvu drinku — detail z něj bere stav surovin */
const ZAZNAMY = new Map();

function vykresliDrinky() {
  const tolerance = +el("tolerance").value;
  el("tolerance-hodnota").textContent = tolerance;
  const dotaz = el("hledat-drink").value;
  let vyber = Barman.najdiDrinky(DRINKY, dotaz, SUROVINY());
  if (rezim === "nealko" && el("filtr-deti").checked)
    vyber = vyber.filter(d => d.deti);
  const v = Barman.vyhodnot(vyber, SUROVINY(), inventar, tolerance, {
    jenNealko: rezim === "nealko",
    typ: el("filtr-typ").value || null,
    nahrady: DATA.nahrady,
    oblibene: [...oblibene]
  });

  ZAZNAMY.clear();
  [v.hned, v.dokoupit, v.ostatni].forEach(sekce =>
    sekce.forEach(z => ZAZNAMY.set(z.drink.nazev, z)));

  el("pocet-hned").textContent = v.hned.length;
  el("pocet-dokoupit").textContent = v.dokoupit.length;
  el("pocet-ostatni").textContent = v.ostatni.length + " " + drinkuSlovo(v.ostatni.length);

  // při aktivním hledání ukázat u výsledků trivii (uživatel hledá třeba „hemingway“)
  const sTrivii = dotaz.trim().length > 0;
  const filtrovano = sTrivii || el("filtr-typ").value || el("filtr-deti").checked;
  el("sekce-hned").innerHTML = v.hned.map(z => karta(z, sTrivii)).join("") ||
    `<div class="prazdno">${filtrovano ? "Tomuhle výběru zatím nic z tvého baru neodpovídá."
      : "Zatím nic — zaškrtni v záložce „Můj bar“, co máš doma."}</div>`;
  el("sekce-dokoupit").innerHTML = v.dokoupit.map(z => karta(z, sTrivii)).join("") ||
    `<div class="prazdno">Nic v dosahu ${tolerance} ${sklonuj(tolerance, ["suroviny", "surovin", "surovin"])} — zkus zvýšit toleranci.</div>`;
  el("sekce-ostatni").innerHTML = v.ostatni.map(z => karta(z, sTrivii)).join("");

  el("sekce-radce").innerHTML = v.radce.slice(0, 6).map(r => {
    const casti = [];
    if (r.odemkne) casti.push(`odemkne <b>${r.odemkne} ${drinkuSlovo(r.odemkne)}</b> hned`);
    if (r.priblizi) casti.push(`přiblíží ${r.priblizi} ${sklonuj(r.priblizi, ["další", "další", "dalších"])}`);
    // rádce je místo, kde se nakupuje — odkaz patří rovnou sem, ne až do detailu drinku
    const odkaz = nakupniOdkaz(SLOVNIK[r.id] || { nazev: r.nazev });
    return `<li>🛒 <a class="koupit" href="${odkaz.url}" target="_blank" rel="noopener"
      title="Najít na ${odkaz.kde}"><b>${esc(r.nazev)}</b> ${odkaz.ikona}</a> — ${casti.join(", ")}</li>`;
  }).join("") || `<li class="prazdno">Máš všechno — rádce nemá co doporučit!</li>`;

  // stejná pravidla jako sekce „Můžeš míchat hned“, tedy včetně záměn
  const hnedVse = Barman.vyhodnot(DRINKY, SUROVINY(), inventar, 0,
    { nahrady: DATA.nahrady }).hned.length;
  el("statistika").textContent =
    `V baru máš ${inventar.size} ${sklonuj(inventar.size, ["surovinu", "suroviny", "surovin"])} · umícháš ${hnedVse} ${drinkuSlovo(hnedVse)}`;
}

  el(id).addEventListener("input", vykresliDrinky));
el("tolerance").addEventListener("input", () => { uloz(); vykresliDrinky(); });

/* ---------- nákup chybějící suroviny ---------- */
// alkohol a sirupy míří na Heureku, potraviny a mixéry na Rohlík
const NA_HEUREKU = new Set(["lihovina", "liker", "vino-vermut-sekt", "pivo", "sirup-sladidlo"]);
const OBCHODY = {
  heureka: { kde: "Heurece", ikona: "🔎",
    url: q => "https://www.heureka.cz/?h%5Bfraze%5D=" + encodeURIComponent(q) },
  // Rohlík bez companyId=1 hledaný výraz nevyplní a ukáže jen chybu
  rohlik: { kde: "Rohlíku", ikona: "🛒",
    url: q => "https://www.rohlik.cz/hledat?q=" + encodeURIComponent(q) + "&companyId=1" }
};

function nakupniOdkaz(s) {
  // „Triple sec / Cointreau (pomerančový likér)“ → „Triple sec“
  const dotaz = s.hledat || s.nazev.split("(")[0].split("/")[0].trim();
  // kategorie „ostatní“ (angostura, worcester, ocet) se dělí podle toho, jestli je v tom alkohol
  const heureka = NA_HEUREKU.has(s.kategorie) || (s.kategorie === "ostatni" && s.alko);
  // pole obchod přebíjí kategorii — ověřeno, co který obchod skutečně vede
  // (Rohlík má bezový sirup a med, ale ne grenadinu ani orgeat)
  const obchod = OBCHODY[s.obchod] || OBCHODY[heureka ? "heureka" : "rohlik"];
  return { url: obchod.url(dotaz), kde: obchod.kde, ikona: obchod.ikona };
}

/* ---------- detail drinku ---------- */
const PUVODY = {
  "iba": "oficiální IBA koktejl", "svetova-klasika": "světová klasika",
  "ceska-klasika": "česká klasika", "party-neoficialni": "párty drink",
  "letni": "letní drink"
};

function otevriDetail(nazev) {
  const zaznam = ZAZNAMY.get(nazev);
  if (!zaznam) return;
  const d = zaznam.drink;
  // co mám, co nahradím a co chybí, spočítal engine (zaznam.stavy)
  const suroviny = d.suroviny.map((s, i) => {
    const info = SLOVNIK[s.id] || { nazev: s.id };
    const stav = zaznam.stavy[i];
    const text = `${esc(info.nazev)} — ${s.mnozstvi}`;
    const volit = s.volitelne ? ` <span class="volitelna">(volitelné)</span>` : "";
    if (stav.mam) return `<li class="mam-ano">${text}${volit}</li>`;
    if (stav.nahrada) return `<li class="mam-zamena">${text}` +
      ` <span class="volitelna">(nahraď: ${esc(SLOVNIK[stav.nahrada].nazev)})</span>${volit}</li>`;
    const odkaz = nakupniOdkaz(info);
    return `<li class="mam-ne"><a class="koupit" href="${odkaz.url}"
      target="_blank" rel="noopener" title="Najít na ${odkaz.kde}">${esc(info.nazev)} ${odkaz.ikona}</a> — ${s.mnozstvi}${volit}</li>`;
  }).join("");
  el("detail-obsah").innerHTML = `
    <div class="obrazek">${obrazekDrinku(d, 180)}</div>
    <h2>${esc(d.nazev)}<span class="stitek">${PUVODY[d.puvod] || d.puvod}</span>${d.nealko ? `<span class="stitek">nealko 🥤</span>` : ""}${d.deti ? `<span class="stitek">pro děti 🧒</span>` : ""}</h2>
    ${d.alt_nazvy ? `<div class="alt">též: ${d.alt_nazvy.join(", ")}</div>` : ""}
    ${d.varovani ? `<p class="varovani">⚠️ ${d.varovani}</p>` : ""}
    <h4>Suroviny</h4><ul>${suroviny}</ul>
    <h4>Postup</h4><p>${d.postup}</p>
    <h4>Servírování</h4>
    <p>🥃 ${d.sklenice}${d.ozdoba && d.ozdoba !== "bez ozdoby" ? ` &nbsp;·&nbsp; 🍒 ${d.ozdoba}` : ""}</p>
    ${d.trivia ? `<h4>Zajímavost</h4><p class="trivia-detail">💡 ${d.trivia}</p>` : ""}
    ${d.poznamka ? `<p class="poznamka">${d.poznamka}</p>` : ""}`;
  el("modal").classList.add("otevreny");
}
el("modal").addEventListener("click", ev => {
  if (ev.target.id === "modal" || ev.target.classList.contains("zavrit"))
    el("modal").classList.remove("otevreny");
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") el("modal").classList.remove("otevreny");
});

/* ---------- start ---------- */
el("tolerance").value = nactene.tolerance ?? 1;
vykresliBar();
vykresliDrinky();
</script>
</body>
</html>
